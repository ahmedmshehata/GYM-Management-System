<!-- Brand Studio icon (48 px and up): a swatch fan, i.e. "pick the brand's colours".
     Neutral slate tile so it sits next to any reseller's own brand. Small sizes use brand-studio-icon-small.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#1E293B"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect id="background" x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect id="rim" x="9" y="9" width="238" height="238" rx="55" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
  <g id="subject" filter="url(#sh)">
    <g transform="rotate(-32 128 194)"><rect x="102" y="44" width="52" height="164" rx="13" fill="#14B8A6"/><rect x="109" y="51" width="38" height="38" rx="8" fill="#fff" opacity="0.3"/></g>
    <g transform="rotate(0 128 194)"><rect x="102" y="44" width="52" height="164" rx="13" fill="#F59E0B"/><rect x="109" y="51" width="38" height="38" rx="8" fill="#fff" opacity="0.3"/></g>
    <g transform="rotate(32 128 194)"><rect x="102" y="44" width="52" height="164" rx="13" fill="#8B5CF6"/><rect x="109" y="51" width="38" height="38" rx="8" fill="#fff" opacity="0.3"/></g>
    <circle cx="128" cy="194" r="12" fill="#F8FAFC"/>
  </g>
</svg>
