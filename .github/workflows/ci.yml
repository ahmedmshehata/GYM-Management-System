name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/GymPro.Tests --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: White-label smoke test (sample brand)
        shell: pwsh
        run: |
          ./tools/publish.ps1 -Brand brands/sample -SkipTests -OutDir publish-sample
          $exe = Get-Item publish-sample/SampleFitness/SampleFitness.exe
          $vi = $exe.VersionInfo
          if ($vi.ProductName -ne 'Sample Fitness Manager') { throw "ProductName is '$($vi.ProductName)'" }
          if ($vi.CompanyName -ne 'Sample Fitness Co.') { throw "CompanyName is '$($vi.CompanyName)'" }
          if (Test-Path publish-sample/SampleFitness/GymPro.Branding.exe) { throw 'GymPro-named tool shipped in a branded package' }
          $settings = Get-Content publish-sample/SampleFitness/appsettings.json -Raw | ConvertFrom-Json
          if ($settings.Branding.productName -ne 'Sample Fitness Manager') { throw 'Branding section not applied' }
          if (-not (Test-Path publish-sample/SampleFitness-*-win-x64.zip)) { throw 'zip missing' }
          "Branded package OK: $($exe.Name), $($vi.ProductName), $($vi.CompanyName)"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  release:
    name: Release package
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish (self-contained win-x64)
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')   # v1.2.0 -> 1.2.0
          ./tools/publish.ps1 -Version $version -SkipTests

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $files = Get-ChildItem publish -Filter 'GymPro-*' | ForEach-Object FullName
          $extra = @()
          if ($env:TAG -match '-') { $extra += '--prerelease' }   # v1.3.0-beta.1 -> pre-release, not "Latest"
          gh release create $env:TAG @files --title "GymPro $env:TAG" --generate-notes @extra
